[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "floter-desktop"
version = "4.0.0"
description = "Desktop assistant with local speech recognition and Jev intent routing"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5,<7", "Pillow>=10.2", "python-dotenv>=1,<2", "jsonschema>=4,<5", "mcp>=1,<2", "langchain-core>=1,<2", "psutil>=5,<8", "pywinauto>=0.6.9; sys_platform == 'win32'"]

[project.optional-dependencies]
voice = ["faster-whisper>=1,<2", "sounddevice>=0.5,<1", "numpy>=1.26"]
voice-light = ["vosk>=0.3.45,<1", "sounddevice>=0.5,<1", "numpy>=1.26"]
dev = ["pytest>=8", "pyinstaller>=6", "build>=1"]
browser = ["playwright>=1.45,<2"]

[project.scripts]
floter = "floter.app:main"

[tool.setuptools]
packages = ["floter", "floter.audio", "floter.security", "floter.tiers", "floter.tools", "floter.ui"]
package-dir = {floter = "."}

[tool.setuptools.package-data]
floter = ["ui/*.qml", "assets/branding/*.png", "assets/branding/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
